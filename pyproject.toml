[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentkai"
version = "0.1.0"
description = "Open-source personal AI agent — model-agnostic, with tools, memory, scheduler and a local dashboard"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "litellm>=1.60",
    "typer>=0.9",
    "rich>=13",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2",
    "pyyaml>=6",
]

[project.scripts]
agentkai = "agentkai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
