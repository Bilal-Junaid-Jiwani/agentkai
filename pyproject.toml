[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentkai"
version = "0.5.0"
description = "Open-source personal AI agent — model-agnostic, with tools, memory, scheduler and a local dashboard"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "litellm>=1.60",
    "typer>=0.9",
    "rich>=13",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2",
    "pyyaml>=6",
    "playwright>=1.40",
    "httpx>=0.27",        # telegram channel + whatsapp sidecar HTTP
    "discord.py>=2.4",    # discord channel
    "websockets>=12",     # built-in webchat channel
]

[project.optional-dependencies]
voice = ["faster-whisper>=1.0"]  # offline speech-to-text (local-whisper)
test = ["pytest>=8", "pytest-asyncio>=0.23"]  # run the test suite

[project.scripts]
agentkai = "agentkai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# Non-Python files that must ship inside the wheel: dashboard SPA,
# skill instructions + tool code (loaded from disk, not as packages),
# and the channel/device/widget contract docs referenced by docs/.
[tool.setuptools.package-data]
agentkai = [
    "dashboard/static/**/*",
    "dashboard/API.md",
    "channels/README.md",
    "channels/static/**/*",
    "channels/examples/**/*",
    "devices/README.md",
    "widgets/PROTOCOL.md",
    "skills_bundle/*/SKILL.md",
    "skills_bundle/*/tools.py",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "real_browser: requires a real Chromium install (opt-in via AGENTKAI_REAL_BROWSER=1)",
]
