<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agentkai</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23f5a623'/%3E%3Ccircle cx='11' cy='14' r='2.5' fill='%23111'/%3E%3Ccircle cx='21' cy='14' r='2.5' fill='%23111'/%3E%3Cpath d='M11 21q5 4 10 0' stroke='%23111' stroke-width='2' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="static/style.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <img id="brand-logo" alt="agentkai logo">
      <div class="brand-text">
        <div class="brand-name">agentkai</div>
        <div class="brand-sub">personal agent</div>
      </div>
    </div>
    <nav id="nav">
      <a href="#/chat" data-route="chat">
        <svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-8 8H4l2-3a8 8 0 1 1 15-5z"/></svg>
        <span>Chat</span>
      </a>
      <a href="#/runs" data-route="runs">
        <svg viewBox="0 0 24 24"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8z"/></svg>
        <span>Runs</span>
      </a>
      <a href="#/memory" data-route="memory">
        <svg viewBox="0 0 24 24"><path d="M12 3v18M5 8c4 2 10 2 14 0M5 16c4-2 10-2 14 0"/></svg>
        <span>Memory</span>
      </a>
      <a href="#/scheduler" data-route="scheduler">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
        <span>Scheduler</span>
      </a>
      <a href="#/tools" data-route="tools">
        <svg viewBox="0 0 24 24"><path d="M14.7 6.3a4.5 4.5 0 0 0-6 6L3 18l3 3 5.7-5.7a4.5 4.5 0 0 0 6-6L14 13l-3-3 3.7-3.7z"/></svg>
        <span>Tools</span>
      </a>
      <a href="#/settings" data-route="settings">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.6-2-3.4-2.4 1a7 7 0 0 0-2-1.2L14 3h-4l-.5 2.6a7 7 0 0 0-2 1.2l-2.4-1-2 3.4 2 1.6A7 7 0 0 0 5 12c0 .4 0 .8.1 1.2l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 2 1.2L10 21h4l.5-2.6a7 7 0 0 0 2-1.2l2.4 1 2-3.4-2-1.6c.1-.4.1-.8.1-1.2z"/></svg>
        <span>Settings</span>
      </a>
    </nav>
    <div class="side-foot">
      <span class="dot ok" id="conn-dot"></span>
      <span id="conn-text">localhost only</span>
    </div>
  </aside>
  <main id="main">
    <header id="topbar">
      <h1 id="page-title">Chat</h1>
      <div class="top-right">
        <span class="pill" id="model-pill" title="default model">…</span>
        <span class="pill secure" title="per-launch token auth active">token ✓</span>
      </div>
    </header>
    <section id="view"></section>
  </main>
</div>
<div id="denied" hidden>
  <div class="denied-card">
    <h2>401 — token missing</h2>
    <p>Open the dashboard with the URL printed by <code>agentkai dashboard</code> (it carries the per-launch token).</p>
  </div>
</div>
<script src="static/app.js"></script>
</body>
</html>
